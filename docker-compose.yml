services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiffra
      POSTGRES_PASSWORD: chiffra
      POSTGRES_DB: chiffra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiffra -d chiffra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./back
    command: npx tsx src/server.ts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://chiffra:chiffra@postgres:5432/chiffra
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./back
    command: npx tsx src/worker.ts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://chiffra:chiffra@postgres:5432/chiffra
      REDIS_URL: redis://redis:6379
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./front
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata: